<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>微信群总结</title>
<link rel="icon" href="/favicon.svg">
<!-- 在设计系统样式加载前解析主题，避免模块入口尚未执行时颜色变量为空。 -->
<script id="theme-bootstrap">
  (() => {
    const values = new Set(['light', 'dark', 'auto']);
    let theme = 'auto';
    try {
      const stored = String(localStorage.getItem('wx-summary:theme') || '').trim();
      if (values.has(stored)) theme = stored;
    } catch {}
    let resolved = theme;
    if (theme === 'auto') {
      try {
        resolved = globalThis.matchMedia?.('(prefers-color-scheme: dark)')?.matches ? 'dark' : 'light';
      } catch {
        resolved = 'light';
      }
    }
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.themeResolved = resolved;
  })();
</script>
<!-- 托盘定位:启动 URL 带 ?focus=<24hex> 时,把令牌写进窗口标题 15 秒,
     供 src/tray/open-web-foreground.ps1 找到并置顶正确窗口;路由恢复后由 router 负责清除 -->
<script>
  window.__WX_LAUNCH_FOCUS_TOKEN__ = '';
  try {
    const launchFocusToken = new URL(window.location.href).searchParams.get('focus') || '';
    if (/^[a-f0-9]{24}$/.test(launchFocusToken)) {
      window.__WX_LAUNCH_FOCUS_TOKEN__ = launchFocusToken;
      document.title = `微信群总结 · wx-focus-${launchFocusToken}`;
    }
  } catch {}
</script>
<!-- 服务端占位符:由 serveIndex 替换,勿改名字 -->
<script>
  window.__WX_BOOT__ = {
    sessionToken: '__SESSION_TOKEN__',
    serviceInstanceId: '__SERVICE_INSTANCE_ID__',
    assetVersion: '__ASSET_VERSION__',
  };
</script>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <!-- 全局进度条:任何页面的长任务都可以驱动它 -->
  <div id="global-progress" class="global-progress" hidden>
    <div class="global-progress-bar"></div>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar">

            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
        </span>
        <span class="brand-name">微信群总结</span>
      </div>

      <nav class="nav" id="nav" aria-label="主导航">
        <a class="nav-item" href="#/digest" data-route="digest">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>总结</span>
        </a>
        <a class="nav-item" href="#/history" data-route="history">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>历史</span>
        </a>
        <a class="nav-item" href="#/settings" data-route="settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>设置</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="account-switcher" id="account-switcher" hidden>
          <button class="account-btn" id="account-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span class="account-avatar" id="account-avatar" aria-hidden="true">微</span>
            <span class="account-meta">
              <span class="account-name" id="account-name">未选择账号</span>
              <span class="account-sub" id="account-sub">点击切换账号</span>
            </span>
            <svg class="account-caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="account-menu" id="account-menu" hidden role="listbox" aria-label="账号列表"></div>
        </div>

        <div class="theme-switch" role="group" aria-label="主题切换">
          <button class="theme-btn" type="button" data-theme-value="light" title="浅色">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <button class="theme-btn" type="button" data-theme-value="auto" title="跟随系统">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          </button>
          <button class="theme-btn" type="button" data-theme-value="dark" title="深色">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="content" id="app" tabindex="-1">
      <noscript><p class="boot-message">此工具需要启用 JavaScript。</p></noscript>
      <p class="boot-message">正在载入…</p>
    </main>
  </div>

  <div id="toast-root" class="toast-root"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
