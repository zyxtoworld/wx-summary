<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wx-summary</title>
  <script>
    window.__WX_LAUNCH_FOCUS_TOKEN__ = '';
    try {
      const launchFocusToken = new URL(window.location.href).searchParams.get('focus') || '';
      if (/^[a-f0-9]{24}$/.test(launchFocusToken)) {
        window.__WX_LAUNCH_FOCUS_TOKEN__ = launchFocusToken;
        document.title = `wx-summary wx-focus-${launchFocusToken}`;
      }
    } catch {}
  </script>
  <script>
    try {
      const theme = localStorage.getItem('wx-summary:theme');
      if (theme === 'auto' || theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="stylesheet" href="/css/app.css?v=__ASSET_VERSION__" />
</head>
<body>
  <script>
    window.__WX_TOKEN__ = "__SESSION_TOKEN__";
    window.__WX_SERVICE_INSTANCE_ID__ = "__SERVICE_INSTANCE_ID__";
    window.__WX_ASSET_VERSION__ = "__ASSET_VERSION__";
  </script>

  <div class="app-sticky-header" id="app-sticky-header">
    <header class="topbar">
      <div class="brand">
        <span class="logo">wx</span>
        <span class="brand-name">wx-summary</span>
        <span class="badge" title="只读本机微信数据；未检测到微信时不显示演示数据">本机只读</span>
      </div>
      <nav class="nav">
        <a href="#/digest" data-route="digest">总结</a>
        <a href="#/history" data-route="history">历史</a>
        <a href="#/settings" data-route="settings">设置</a>
      </nav>
      <div class="topbar-right">
        <select id="account-switcher" class="account-switcher" title="切换微信账号" aria-label="切换微信账号"></select>
        <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">☀</button>
      </div>
    </header>

    <section class="global-digest-activity hidden" id="global-digest-activity">
      <span class="global-digest-dot"></span>
      <span class="global-digest-text" id="global-digest-text">生成中...</span>
      <span class="sr-only" id="global-digest-announcer" role="status" aria-live="polite" aria-atomic="true"></span>
      <button class="link-btn" id="global-digest-jump" type="button">查看</button>
      <button class="link-btn danger-link" id="global-digest-cancel" type="button">取消</button>
    </section>
  </div>

  <main id="app">
    <section class="page">
      <section class="notice-card">
        <strong>正在检查本机状态</strong>
        <span>正在读取微信账号、配置和本地服务状态，请稍等。</span>
      </section>
    </section>
  </main>

  <!-- 模板：主页 -->
  <template id="tpl-digest">
    <section class="page page-digest">
      <h2 class="sr-only" id="digest-page-title">总结</h2>
      <aside class="sidebar">
        <div class="sidebar-header">
          <input type="text" id="group-search" aria-label="搜索群" placeholder="搜索群（支持拼音首字母）" autocomplete="off" title="/ 聚焦搜索" />
          <span class="sr-only" id="group-results-status" role="status" aria-live="polite" aria-atomic="true">正在读取群列表</span>
        </div>
        <ul class="group-list" id="group-list">
          <li class="muted loading">正在检查本地微信数据并读取群列表，首次可能需要约 1 分钟...</li>
        </ul>
        <div class="sidebar-group-status hidden" id="group-list-inline-status" role="status" aria-live="polite" aria-atomic="true"></div>
        <div class="sidebar-footer">
          <span id="selected-count">已选 0 个</span>
          <div class="sidebar-footer-actions">
            <button class="link-btn" id="clear-selected-groups" type="button" disabled>清空</button>
            <button class="link-btn" id="select-whitelist" type="button">全选白名单</button>
          </div>
        </div>
      </aside>

      <div class="main-pane" aria-labelledby="digest-page-title">
        <section class="notice-card hidden" id="wechat-notice" role="status" aria-live="polite" aria-atomic="true"></section>

        <section class="card">
          <h3 class="card-title">时间范围</h3>
          <div class="quick-range" id="quick-range">
            <button data-range="today" aria-pressed="false">今天</button>
            <button data-range="yesterday" aria-pressed="false">昨天</button>
            <button data-range="yesterdayToday" class="active" aria-pressed="true">昨天+今天</button>
            <button data-range="last4h" aria-pressed="false">最近 4h</button>
            <button data-range="last12h" aria-pressed="false">最近 12h</button>
            <button data-range="last1d" aria-pressed="false">最近 24h</button>
            <button data-range="thisweek" aria-pressed="false">本周</button>
            <button data-range="custom" aria-pressed="false">自定义</button>
          </div>
          <div class="range-summary" id="range-summary"></div>
          <div class="custom-range hidden" id="custom-range">
            <div class="range-picker" id="range-picker">
              <button class="range-field" id="range-start" type="button" data-range-side="since" aria-controls="range-popover" aria-expanded="false">
                <span>开始</span>
                <strong id="range-start-text"></strong>
              </button>
              <span class="dash">~</span>
              <button class="range-field" id="range-end" type="button" data-range-side="until" aria-controls="range-popover" aria-expanded="false">
                <span>结束</span>
                <strong id="range-end-text"></strong>
              </button>
              <div class="range-popover hidden" id="range-popover" role="dialog" aria-modal="false" aria-label="选择自定义时间范围">
                <div class="calendar-head">
                  <button class="icon-btn" id="range-prev-month" type="button" title="上个月" aria-label="上个月">&lt;</button>
                  <strong id="range-month-title"></strong>
                  <button class="icon-btn" id="range-next-month" type="button" title="下个月" aria-label="下个月">&gt;</button>
                </div>
                <div class="weekday-row">
                  <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
                </div>
                <div class="calendar-grid" id="range-calendar" role="group" aria-label="选择日期"></div>
                <div class="time-select-row">
                  <span class="field-label" id="range-time-label">时间</span>
                  <select id="range-hour" aria-label="小时"></select>
                  <select id="range-minute" aria-label="分钟"></select>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="card">
          <h3 class="card-title">过滤（可选）</h3>
          <div class="filter-row">
            <span class="field-label" id="filter-senders-label">发送人</span>
            <div class="chip-input" data-name="senders">
              <input type="text" aria-labelledby="filter-senders-label" placeholder="输入后回车 / 逗号分隔" />
            </div>
          </div>
          <div class="filter-row">
            <span class="field-label" id="filter-keywords-label">关键词</span>
            <div class="chip-input" data-name="keywords">
              <input type="text" aria-labelledby="filter-keywords-label" placeholder="输入后回车 / 逗号分隔" />
            </div>
          </div>
          <div class="filter-row">
            <span class="field-label" id="exclude-types-label">排除类型</span>
            <div class="check-row" role="group" aria-labelledby="exclude-types-label">
              <label><input type="checkbox" name="ex" value="image" /> 图片</label>
              <label><input type="checkbox" name="ex" value="voice" /> 语音</label>
              <label><input type="checkbox" name="ex" value="video" /> 视频</label>
              <label><input type="checkbox" name="ex" value="file" /> 文件</label>
            </div>
          </div>
          <div class="filter-row">
            <label for="min-messages">最少消息数</label>
            <input type="number" id="min-messages" value="1" min="1" max="9999" class="num-input" />
            <span class="muted small field-hint" id="min-messages-hint" role="status" aria-live="polite"></span>
          </div>
        </section>

        <section class="card">
          <h3 class="card-title">渲染选项</h3>
          <div class="filter-row">
            <span class="field-label" id="digest-theme-label">主题</span>
            <div class="radio-row" role="radiogroup" aria-labelledby="digest-theme-label">
              <label><input type="radio" name="theme" value="auto" checked /> 跟随系统</label>
              <label><input type="radio" name="theme" value="light" /> 浅色</label>
              <label><input type="radio" name="theme" value="dark" /> 暗色</label>
            </div>
          </div>
          <div class="filter-row">
            <span class="field-label" id="digest-fontsize-label">字号</span>
            <div class="radio-row" role="radiogroup" aria-labelledby="digest-fontsize-label">
              <label><input type="radio" name="fontsize" value="normal" checked /> 标准</label>
              <label><input type="radio" name="fontsize" value="large" /> 大号</label>
            </div>
          </div>
        </section>

        <div class="action-row">
          <button class="btn btn-primary" id="btn-generate" disabled title="Ctrl+Enter" aria-describedby="digest-action-status">生成长图</button>
          <button class="btn btn-ghost" id="btn-preview-text" disabled aria-describedby="digest-action-status" title="调用 AI 生成摘要文本，不绘制或保存 PNG">生成文本预览</button>
          <button class="btn btn-danger hidden" id="btn-cancel-digest" type="button" title="Esc">取消生成</button>
          <span class="status digest-action-status" id="digest-action-status"></span>
        </div>

        <section class="card progress-card hidden" id="progress-card">
          <div class="progress-bar-row">
            <div class="progress-bar" id="progress-bar" role="progressbar" aria-label="生成流程完成度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div></div>
            <span class="progress-percent" id="progress-percent" aria-label="生成流程完成度 0%">0%</span>
            <button class="icon-btn progress-dismiss hidden" id="progress-dismiss" type="button" aria-label="收起本次生成状态" title="收起本次生成状态，不影响已生成的预览或历史记录">&times;</button>
          </div>
          <div class="progress-current hidden" id="progress-current"></div>
          <div class="progress-failure-reasons hidden" id="progress-failure-reasons"></div>
          <div class="progress-summary hidden" id="progress-summary" role="list" aria-label="生成步骤总览"></div>
          <div class="progress-detail-tools hidden" id="progress-detail-tools">
            <button class="btn btn-ghost" id="progress-detail-toggle" type="button" aria-controls="progress-stages" aria-expanded="false">查看本次详情</button>
            <span class="status" id="progress-detail-status" role="status" aria-live="polite"></span>
          </div>
          <ul class="progress-stages hidden" id="progress-stages"></ul>
          <div class="progress-log-tools hidden" id="progress-log-tools">
            <button class="btn btn-ghost" id="progress-log-toggle" type="button" aria-controls="progress-log" aria-expanded="false">查看故障排查日志</button>
            <span class="status" id="progress-log-status" role="status" aria-live="polite"></span>
          </div>
          <pre class="progress-log hidden" id="progress-log"></pre>
        </section>

        <section class="card batch-results-card hidden" id="batch-results" aria-label="批量生成结果"></section>

        <section class="card preview-card hidden" id="preview-card">
          <div class="card-head preview-card-head">
            <div class="preview-heading">
              <h3 class="card-title">长图预览</h3>
              <p class="preview-identity hidden" id="preview-identity" role="status" aria-live="polite" aria-atomic="true"></p>
            </div>
          </div>
          <div class="preview-canvas-wrap" tabindex="0" aria-label="长图预览滚动区域">
            <canvas id="digest-canvas" role="button" tabindex="0" aria-label="查看 100% 长图预览" title="点击查看 100%"></canvas>
            <img id="digest-rerender-preview" role="button" tabindex="0" aria-label="查看重渲染 PNG 的 100% 预览" title="点击查看 100%" alt="重渲染 PNG 预览" hidden />
          </div>
          <div class="preview-actions">
            <button class="btn" id="btn-download" title="Ctrl+S" aria-describedby="preview-status" disabled>⬇ 下载 PNG</button>
            <button class="btn" id="btn-copy" title="Ctrl+Shift+C" aria-describedby="preview-status" disabled>📋 复制到剪贴板</button>
            <button class="btn" id="btn-reveal" aria-describedby="preview-status" disabled title="保存后可用">📁 在文件夹中显示</button>
            <button class="btn btn-ghost" id="btn-copy-path" aria-describedby="preview-status" disabled title="保存后可用">复制路径</button>
            <button class="btn btn-ghost" id="btn-rerender" aria-describedby="preview-status" disabled>🔄 重新渲染</button>
            <span class="status" id="preview-status" role="status" aria-live="polite">点击长图查看 100%</span>
          </div>
          <p class="status warn digest-source-update-notice hidden" id="preview-source-update-notice" role="status" aria-live="polite"></p>
        </section>

        <section class="card text-preview-card hidden" id="text-preview-card">
          <div class="card-head">
            <h3 class="card-title">文本预览</h3>
            <div class="preview-actions compact">
              <button class="btn btn-ghost" id="btn-copy-md" aria-describedby="text-preview-status" disabled>复制文本</button>
              <button class="btn btn-ghost" id="btn-export-md" aria-describedby="text-preview-status" disabled>导出 MD</button>
              <button class="btn btn-ghost" id="btn-download-md" aria-describedby="text-preview-status" disabled title="导出后可用">⬇ 下载 MD</button>
              <button class="btn btn-ghost" id="btn-reveal-md" aria-describedby="text-preview-status" disabled title="导出后可用">📁 在文件夹中显示</button>
              <button class="btn btn-ghost" id="btn-copy-md-path" aria-describedby="text-preview-status" disabled title="导出后可用">复制路径</button>
              <span class="status" id="text-preview-status" role="status" aria-live="polite"></span>
            </div>
          </div>
          <p class="status warn digest-source-update-notice hidden" id="text-preview-source-update-notice" role="status" aria-live="polite"></p>
          <pre id="text-preview" tabindex="0" aria-label="文本预览滚动区域"></pre>
        </section>
      </div>
    </section>
  </template>

  <!-- 模板：历史页 -->
  <template id="tpl-history">
    <section class="page page-history">
      <div class="page-head">
        <h2>历史摘要</h2>
        <div class="history-page-actions">
          <input type="text" id="history-search" maxlength="500" aria-label="搜索历史摘要" placeholder="搜索群名 / 日期 / 账号 / 摘要片段" />
          <button class="icon-btn hidden" id="history-clear-search" type="button" aria-label="清空历史搜索" title="清空历史搜索，查看全部历史">&times;</button>
          <button class="icon-btn" id="history-refresh" type="button" aria-label="刷新历史摘要" title="刷新历史摘要">&#8635;</button>
        </div>
      </div>
      <div class="history-filter-row" role="group" aria-label="历史记录类型">
        <button class="seg-btn selected" id="history-filter-ok" type="button" data-history-filter="ok" aria-pressed="true">正常摘要</button>
        <button class="seg-btn" id="history-filter-issues" type="button" data-history-filter="issues" aria-pressed="false">异常记录</button>
        <label class="history-account-filter" for="history-account-filter">
          <span>账号范围</span>
          <select id="history-account-filter" aria-label="历史账号范围">
            <option value="current">当前账号</option>
            <option value="all">全部账号</option>
          </select>
        </label>
      </div>
      <p class="history-scope-note muted small" id="history-scope-note"></p>
      <div class="notice-card history-partial-notice hidden" id="history-partial-notice"></div>
      <p class="sr-only" id="history-live-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <div class="history-grid" id="history-grid" role="list"></div>
      <div class="action-row history-more-row hidden" id="history-more-row">
        <button class="btn btn-ghost" id="history-more" type="button">加载更多</button>
        <div class="history-more-copy">
          <span class="status" id="history-more-status" tabindex="-1"></span>
          <details class="history-warning-details hidden" id="history-warning-details">
            <summary id="history-warning-summary">查看历史说明</summary>
            <ul id="history-warning-list"></ul>
          </details>
        </div>
      </div>
      <p class="empty hidden" id="history-empty" tabindex="-1">还没有摘要记录。回到「总结」页生成一个吧。</p>
    </section>
  </template>

  <!-- 模板：设置页 -->
  <template id="tpl-settings">
    <section class="page page-settings">
      <div class="page-head"><h2>设置</h2></div>
      <div class="notice-card settings-revision-notice hidden" id="settings-revision-notice" role="status" aria-live="polite">
        <strong>设置已在别处更新</strong>
        <span id="settings-revision-message">当前页面显示的是更新前的设置。重新载入后会使用最新设置。</span>
        <button class="btn btn-ghost" id="settings-reload-latest" type="button">重新载入最新设置</button>
      </div>
      <div class="notice-card hidden" id="settings-save-wait" role="status" aria-live="polite">
        <strong id="settings-save-wait-title">正在保存设置</strong>
        <span id="settings-save-wait-message">请求正在写入本机设置。</span>
        <button class="btn btn-ghost" id="settings-stop-save-wait" type="button">转为后台等待</button>
      </div>

      <div class="settings-section-tabs" role="tablist" aria-label="设置分类">
        <button class="settings-section-tab" id="settings-tab-ai" type="button" role="tab" aria-controls="settings-panel-ai" aria-selected="true" tabindex="0" data-settings-tab="ai">AI 接入</button>
        <button class="settings-section-tab" id="settings-tab-scheduler" type="button" role="tab" aria-controls="settings-panel-scheduler" aria-selected="false" tabindex="-1" data-settings-tab="scheduler">群与调度</button>
        <button class="settings-section-tab" id="settings-tab-render" type="button" role="tab" aria-controls="settings-panel-render" aria-selected="false" tabindex="-1" data-settings-tab="render">渲染与输出</button>
        <button class="settings-section-tab" id="settings-tab-privacy" type="button" role="tab" aria-controls="settings-panel-privacy" aria-selected="false" tabindex="-1" data-settings-tab="privacy">隐私与安全</button>
        <button class="settings-section-tab" id="settings-tab-acceptance" type="button" role="tab" aria-controls="settings-panel-acceptance" aria-selected="false" tabindex="-1" data-settings-tab="acceptance">本机状态</button>
        <button class="settings-section-tab" id="settings-tab-about" type="button" role="tab" aria-controls="settings-panel-about" aria-selected="false" tabindex="-1" data-settings-tab="about">关于</button>
      </div>

      <section class="card setting-card" id="settings-panel-ai" role="tabpanel" aria-labelledby="settings-tab-ai" data-settings-section="ai">
        <h3>AI 接入</h3>
        <div class="form-row"><span class="field-label" id="s-provider-label">Provider</span>
          <div class="radio-row" role="radiogroup" aria-labelledby="s-provider-label">
            <label><input type="radio" name="s-provider" value="openai" /> OpenAI</label>
            <label><input type="radio" name="s-provider" value="anthropic" /> Anthropic</label>
          </div>
        </div>
        <div class="form-row"><label for="s-baseurl">Base URL</label><input id="s-baseurl" type="url" inputmode="url" autocomplete="url" placeholder="https://your-endpoint/v1" /></div>
        <div class="form-row"><label for="s-apikey">API Key</label>
          <div class="key-input">
            <input id="s-apikey" type="password" placeholder="留空继续使用已保存 Key；粘贴新 Key 后保存会覆盖" />
            <button class="icon-btn" id="s-apikey-toggle" type="button" aria-label="显示正在输入的新 Key" aria-pressed="false" title="显示正在输入的新 Key">👁</button>
            <button class="btn btn-ghost" id="s-apikey-clear" type="button">清除已保存 Key</button>
          </div>
          <span class="muted small" id="s-apikey-mask"></span>
        </div>
        <div class="form-row inline">
          <button class="btn" id="s-list-models" type="button">获取模型</button>
          <span class="status" id="s-model-status" role="status" aria-live="polite"></span>
        </div>
        <div class="form-row"><label for="s-model-select" id="s-model-label">模型</label>
          <select id="s-model-select"></select>
          <label class="inline-check"><input id="s-model-custom" type="checkbox" aria-label="使用自定义模型名称" /> 自定义</label>
          <input id="s-model" class="hidden" type="text" aria-labelledby="s-model-label" placeholder="model-id" />
        </div>
        <div class="form-row"><label for="s-model-long-select" id="s-model-long-label">长上下文模型</label>
          <select id="s-model-long-select"></select>
          <label class="inline-check"><input id="s-model-long-custom" type="checkbox" aria-label="使用自定义长上下文模型名称" /> 自定义</label>
          <input id="s-model-long" class="hidden" type="text" aria-labelledby="s-model-long-label" placeholder="model-id" />
        </div>
        <div class="form-row"><label for="s-ai-concurrency">AI 并发</label>
          <input id="s-ai-concurrency" type="number" min="1" max="8" step="1" />
          <span class="muted small">1-8；单账号建议 1，默认 2</span>
        </div>
        <div class="form-row inline">
          <button class="btn" id="s-test-llm" type="button">基础连通测试</button>
          <button class="btn btn-ghost busy-cancel hidden" id="s-cancel-llm-action" type="button">取消当前请求</button>
          <button class="btn btn-primary" id="s-save-llm" aria-label="保存 AI 接入设置" disabled>保存</button>
          <span class="status" id="s-llm-status" role="status" aria-live="polite"></span>
        </div>
      </section>

      <section class="card setting-card" id="settings-panel-scheduler" role="tabpanel" aria-labelledby="settings-tab-scheduler" data-settings-section="scheduler">
        <h3>群与调度</h3>
        <div class="form-row"><span class="field-label" id="s-whitelist-label">白名单</span>
          <div class="settings-whitelist-panel">
            <div class="setup-whitelist-tools settings-whitelist-tools">
              <input id="s-whitelist-search" type="text" aria-label="搜索白名单群名或 ID" placeholder="搜索群名 / ID" />
              <button class="btn" id="s-whitelist-all-visible" type="button">全选当前显示</button>
              <button class="btn btn-ghost" id="s-whitelist-clear-visible" type="button">清空当前账号显示</button>
              <button class="btn btn-ghost danger-link" id="s-whitelist-clear-all" type="button">清空全部白名单和未绑定旧规则</button>
            </div>
            <div class="whitelist-area setup-whitelist-list" id="s-whitelist" role="group" aria-labelledby="s-whitelist-label"></div>
            <p class="muted small" id="s-whitelist-count"></p>
            <div class="status warn hidden" id="s-whitelist-legacy" role="status" aria-live="polite"></div>
          </div>
        </div>
        <div class="form-row inline">
          <label class="switch"><input type="checkbox" id="s-scheduler" /> 启用定时摘要</label>
        </div>
        <div class="form-row"><span class="field-label" id="s-scheduler-interval-label">检查间隔</span>
          <input id="s-scheduler-interval" type="hidden" />
          <div class="duration-control" data-duration-field="s-scheduler-interval" role="group" aria-labelledby="s-scheduler-interval-label">
            <input id="s-scheduler-interval-value" type="number" min="1" step="1" aria-label="检查间隔数值" />
            <select id="s-scheduler-interval-unit" aria-label="检查间隔单位">
              <option value="m">分钟</option>
              <option value="h">小时</option>
              <option value="d">天</option>
            </select>
          </div>
          <span class="muted small">定时任务多久检查一次</span>
        </div>
        <div class="form-row"><span class="field-label" id="s-scheduler-window-label">摘要窗口</span>
          <input id="s-scheduler-window" type="hidden" />
          <div class="duration-control" data-duration-field="s-scheduler-window" role="group" aria-labelledby="s-scheduler-window-label">
            <input id="s-scheduler-window-value" type="number" min="1" step="1" aria-label="摘要窗口数值" />
            <select id="s-scheduler-window-unit" aria-label="摘要窗口单位">
              <option value="m">分钟</option>
              <option value="h">小时</option>
              <option value="d">天</option>
            </select>
          </div>
          <span class="muted small">首次检查的回溯范围；后续会从上次检查位置接续，并覆盖延迟写入的消息</span>
        </div>
        <div class="form-row"><label for="s-scheduler-min">最低消息数</label>
          <input id="s-scheduler-min" type="number" min="1" max="9999" step="1" />
          <span class="muted small field-hint" id="s-scheduler-min-hint" role="status" aria-live="polite"></span>
        </div>
        <div class="form-row"><span class="field-label" id="s-override-label">每群自动检查规则</span>
          <div class="override-editor" role="group" aria-labelledby="s-override-label">
            <div class="override-add-row">
              <select id="s-override-group" aria-label="覆盖规则群"></select>
              <input id="s-override-keywords" type="text" aria-label="覆盖规则关键词" placeholder="关键词，逗号分隔" />
              <input id="s-override-min" type="number" min="1" max="9999" step="1" aria-label="覆盖规则最低消息数" placeholder="最低消息数" />
              <button class="btn" id="s-add-override" type="button">添加</button>
            </div>
            <span class="muted small field-hint" id="s-override-min-hint" role="status" aria-live="polite"></span>
            <div class="override-list" id="s-overrides"></div>
            <span class="muted small">添加后该群会自动纳入定时检查；请至少填写关键词或最低消息数。只想使用全局规则时，把群加入白名单即可。</span>
          </div>
        </div>
        <div class="form-row inline scheduler-control-row">
          <button class="btn btn-primary" id="s-save-groups" aria-label="保存群与调度设置" disabled>保存</button>
          <button class="btn" id="s-run-scheduler" type="button" disabled>立即检查所有已保存目标</button>
          <button class="btn btn-ghost busy-cancel hidden" id="s-cancel-scheduler" type="button">取消检查</button>
          <span class="status" id="s-scheduler-status" role="status" aria-live="polite" tabindex="-1"></span>
          <span class="scheduler-status-actions" id="s-scheduler-actions" aria-label="调度结果操作"></span>
        </div>
      </section>

      <section class="card setting-card" id="settings-panel-render" role="tabpanel" aria-labelledby="settings-tab-render" data-settings-section="render">
        <h3>渲染与输出</h3>
        <div class="form-row"><label for="s-theme">默认主题</label>
          <select id="s-theme"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">暗色</option></select>
        </div>
        <div class="form-row"><label for="s-fontsize">默认字号</label>
          <select id="s-fontsize"><option value="normal">标准</option><option value="large">大号</option></select>
        </div>
        <div class="form-row"><label for="s-outdir">输出目录</label>
          <input id="s-outdir" type="text" />
          <button class="btn btn-ghost" id="s-open-outdir" aria-label="打开摘要输出目录" disabled>打开</button>
          <span class="muted small">必须在 outputs/ 下，避免摘要索引和 JSON 混入源码目录</span>
        </div>
        <div class="form-row"><label for="s-retention">保留天数</label>
          <input id="s-retention" type="number" min="0" max="3650" step="1" inputmode="numeric" />
          <span class="muted small">0 = 无限保留；大于 0 时，下次启动会清理超过天数的历史 PNG、摘要 JSON、导出的 MD 及其元数据（仅当前输出目录内）</span>
        </div>
        <div class="status warn hidden" id="s-retention-cleanup-warning" role="status" aria-live="polite"></div>
        <div class="form-row inline">
          <button class="btn btn-primary" id="s-save-render" aria-label="保存渲染与输出设置" disabled>保存</button>
          <span class="status" id="s-render-status" role="status" aria-live="polite"></span>
        </div>
      </section>

      <section class="card setting-card" id="settings-panel-privacy" role="tabpanel" aria-labelledby="settings-tab-privacy" data-settings-section="privacy">
        <h3>隐私与安全</h3>
        <div class="form-row inline">
          <span class="field-label" id="s-redact-label">脱敏选项</span>
          <div class="check-row" role="group" aria-labelledby="s-redact-label">
            <label><input type="checkbox" id="s-redact-phone" /> 手机号脱敏</label>
            <label><input type="checkbox" id="s-redact-id" /> 身份证脱敏</label>
            <label><input type="checkbox" id="s-redact-bank" /> 银行卡脱敏</label>
            <label><input type="checkbox" id="s-redact-email" /> 邮箱脱敏</label>
          </div>
          <span class="muted small">只处理消息文本、文件名、链接摘要等文字字段；图片/音频内容若附给 AI，不做画面或语音脱敏</span>
        </div>
        <div class="form-row inline">
          <span class="field-label" id="s-media-privacy-label">AI 媒体内容</span>
          <div class="check-row" role="group" aria-labelledby="s-media-privacy-label">
            <label><input type="checkbox" id="s-attach-media" /> 图片、视频关键帧和语音附给 AI 识别</label>
          </div>
          <span class="muted small">关闭时只发送媒体元信息和前后文本；不会复制、解码或上传本地图片、视频、语音内容</span>
        </div>
        <div class="form-row"><label for="s-keymode">本次保存对手动候选的处理</label>
          <select id="s-keymode"><option value="auto">保留已保存候选（本次不修改）</option><option value="manual">保存或覆盖当前账号手动候选</option></select>
          <p class="muted small" id="s-keymode-help"></p>
        </div>
        <div class="form-row hidden" id="s-manual-key-row"><label for="s-manual-key">手动密钥</label><div class="secret-textarea-field"><textarea class="secret-textarea-masked" id="s-manual-key" rows="3" spellcheck="false" autocomplete="new-password" placeholder="每行一个 64/96/128/160/192 位 hex；也可粘贴 all_keys.json、导出 blob、x'...' 或 0x... 片段"></textarea><button class="icon-btn secret-textarea-toggle" id="s-manual-key-toggle" type="button" aria-label="显示手动密钥输入" aria-pressed="false" title="显示手动密钥输入">👁</button></div><p class="muted small" id="s-manual-key-help"></p></div>
        <details class="settings-advanced settings-db-mirror-troubleshooting hidden" id="s-db-mirror-troubleshooting" aria-hidden="true">
          <summary>本地数据状态</summary>
          <div class="settings-copy-policy">
            <span class="status" id="s-db-mirror-status" role="status" aria-live="polite"></span>
            <p class="muted small">这里不是设置项，也不用配置路径。刷新群列表、生成长图、生成文本预览和验证数据库时，系统会自动检查本地微信数据；需要更新时会自己复制和替换本地工作数据。微信仍在写库或账号不明确时会停下来，避免拿旧数据伪成功。</p>
            <div class="settings-db-mirror-diagnostics hidden" id="s-db-mirror-diagnostics">
              <p class="muted small">连续失败后这里只显示失败原因；“重新检查本地数据”只是立即再跑一次自动检查，不提供手动导入、路径配置或人工覆盖开关。</p>
            </div>
          </div>
        </details>
        <div class="form-row inline">
          <button class="btn btn-primary" id="s-save-privacy" aria-label="保存隐私与安全设置" disabled>保存</button>
          <button class="btn btn-ghost" id="s-validate-manual-key" type="button" disabled>验证手动密钥</button>
          <button class="btn btn-ghost danger-link" id="s-clear-manual-key" type="button" disabled>清除当前账号手动密钥</button>
          <button class="btn btn-ghost danger-link" id="s-clear-legacy-manual-key" type="button" disabled>清除旧版全局密钥</button>
          <button class="btn btn-ghost" id="s-export-diag" disabled>导出轻量诊断</button>
          <button class="btn btn-ghost" id="s-export-diag-full" disabled>导出完整诊断</button>
          <button class="btn btn-ghost" id="s-view-logs" type="button" aria-controls="s-log-panel" aria-expanded="false" disabled>查看运行记录</button>
          <button class="btn btn-ghost busy-cancel hidden" id="s-cancel-privacy-action" type="button">取消当前任务</button>
          <span class="status" id="s-privacy-status" role="status" aria-live="polite"></span>
          <span class="status" id="s-log-status" role="status" aria-live="polite"></span>
        </div>
        <section class="settings-run-log hidden" id="s-log-panel" aria-labelledby="s-log-summary">
          <strong class="settings-run-log-summary" id="s-log-summary"></strong>
          <ol class="settings-run-log-list" id="s-log-events" aria-label="本轮关键运行记录"></ol>
          <p class="empty hidden" id="s-log-empty"></p>
          <details class="settings-raw-log" id="s-log-raw-details">
            <summary id="s-log-raw-summary">查看原始日志（仅供故障排查）</summary>
            <p class="muted small">这里保留脱敏后的技术流水，事件名和 JSON 字段主要供排查使用；判断当前是否正常请以上方本轮运行记录为准。</p>
            <pre class="progress-log" id="s-log-tail"></pre>
          </details>
        </section>
      </section>

      <section class="card setting-card" id="settings-panel-acceptance" role="tabpanel" aria-labelledby="settings-tab-acceptance" data-settings-section="acceptance">
        <div class="card-head">
          <h3 class="card-title">本机状态</h3>
          <button class="btn btn-ghost" id="s-export-acceptance-md" type="button" disabled>导出记录</button>
          <button class="btn btn-ghost" id="s-refresh-acceptance" type="button" disabled>刷新</button>
        </div>
        <div class="acceptance-checks" id="s-acceptance-checks">
          <p class="empty">正在准备本机状态...</p>
        </div>
        <span class="status" id="s-acceptance-status" role="status" aria-live="polite"></span>
      </section>

      <section class="card setting-card muted" id="settings-panel-about" role="tabpanel" aria-labelledby="settings-tab-about" data-settings-section="about">
        <h3>关于</h3>
        <p>版本 0.1.0 · 平台 <span id="s-platform"></span> · 项目 <span id="s-projroot"></span></p>
        <p>本工具在本机只读采集与解密；生成摘要时只把所选时间窗内容发送到你配置的 AI 端点，不发往其他服务。密钥提取走纯只读路径，不 hook 不注入。</p>
      </section>
    </section>
  </template>

  <!-- 模板：首次启动向导 -->
  <template id="tpl-setup">
    <section class="page page-setup">
      <div class="setup-card">
        <div class="setup-header">
          <h2 id="setup-title">欢迎使用 wx-summary</h2>
          <div class="setup-progress"><span id="setup-step">1</span> / 4</div>
        </div>
        <div class="setup-body" id="setup-body" aria-busy="true"></div>
        <p class="status setup-live-status" id="setup-live-status" role="status" aria-live="polite" aria-atomic="true">正在读取本机设置...</p>
        <div class="setup-footer">
          <button type="button" class="btn btn-ghost" id="setup-back" disabled>上一步</button>
          <button type="button" class="btn btn-primary" id="setup-next" disabled title="正在读取本机设置">正在读取</button>
        </div>
      </div>
    </section>
  </template>

  <script type="module" src="/js/app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
